<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">  <!-- Importando o thymeleaf -->
<head>
    <meta charset="UTF-8">
    <title>Lista de filmes</title>
</head>
<body>
<h1>Lista de filme</h1>

<table>
  <thead>
    <tr>
      <th>NOME</th>
      <th>DURACAO</th>
      <th>ANO DE LANCAMENTO</th>
      <th>GÊNERO</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="filme : ${lista}"> <!-- fazendo um loop com o thymeleaf para mostrar todos os itens do array lista -->
      <td th:text="${filme.nome}"></td>
      <td th:text="${filme.duracaoEmMinutos}"></td>
      <td th:text="${filme.anoLancamento}"></td>
      <td th:text="${filme.genero}"></td>
    </tr>
  </tbody>
</table>
</body>
</html>
